# Builds Yapfast for Windows and Linux in one run, on demand or on a
# push to Mice-custom: Actions > Build > Run workflow. Nothing is published
# and no secrets are used; each platform's files are artifacts of the run.
#
#   windows   the installer (Yapfast-*-windows-x64-setup.exe) and the portable ZIP
#   linux     the AppImage and its .zsync file
#
# Windows is cross-built on Linux as scripts/build-windows does it, and Inno
# Setup compiles the installer on a Windows runner, since Wine doesn't start on
# the Linux one.

name: Build

on:
  workflow_dispatch:
  push:
    branches: [Mice-custom]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo-xwin
            .local/windows/skia-static-production/build.json
            .local/windows/skia-static-production/prepared
          key: windows-skia-${{ hashFiles('nix/flake.lock', 'nix/prepare-windows-skia.py', 'nix/prepare-skia-native.py', 'nix/skia-windows-builder/**') }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: windows
      - run: nix develop path:./nix#windows --command scripts/build-windows discord --no-installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: target/dist/discord/Yapfast-*-windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  windows-installer:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: zip
      - name: Make the installer
        shell: pwsh
        run: |
          $zip = Get-ChildItem zip -Filter 'Yapfast-*-windows-x64.zip' | Select-Object -First 1
          $version = $zip.Name -replace '^Yapfast-(.+)-windows-x64\.zip$', '$1'
          Expand-Archive $zip.FullName -DestinationPath package
          $source = (Get-ChildItem package -Directory | Select-Object -First 1).FullName
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          New-Item -ItemType Directory -Force out | Out-Null
          & $iscc /Q "/DAppVersion=$version" "/DVersionNumber=$($version.Split('-')[0])" "/DSourceDir=$source" "/DLicenseFile=$((Resolve-Path LICENSE).Path)" "/O$((Resolve-Path out).Path)" packaging\windows\yapfast.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            out/Yapfast-*-setup.exe
            zip/Yapfast-*-windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  linux:
    runs-on: ubuntu-latest
    steps:
      # The runner's preinstalled SDKs leave too little room for the build.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          # Nix refuses a shallow Git repository as a flake.
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      # A fresh runner installs Rust and fetches the crates for longer than
      # scripts/package-linux.py gives cargo metadata.
      - name: Fetch the toolchain and crates
        run: nix develop path:./nix --command cargo fetch --locked
      - run: scripts/build-appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            target/dist/linux/Yapfast-*.AppImage
            target/dist/linux/Yapfast-*.AppImage.zsync
          if-no-files-found: error
          compression-level: 0
